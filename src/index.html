<html lang="fr">

<body>
<nav>
  <div class="brand"><img src="assets/logo-bullo-256.png" onerror="this.onerror=null;this.src='bullo-logo.svg'" alt="Logo Bullo" width="36" height="36"><b>Bullo</b></div>
  <button data-v="home"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span>Accueil</span></button>
  <button data-v="capture"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg><span>Capturer</span></button>
  <button data-v="inbox"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13l3-8h12l3 8v6H3z"/><path d="M3 13h5l1 3h6l1-3h5"/></svg><span>Inbox</span></button>
  <button data-v="reminders"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0112 0v5l2 2H4z"/><path d="M10 21h4"/></svg><span>Rappels</span></button>
  <button data-v="search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><span>Rechercher</span></button>
  <button data-v="tools"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 6a4 4 0 005 5l-9 9a2.1 2.1 0 01-3-3l9-9z"/><path d="M14 6l-3-3"/></svg><span>Outils</span></button>
  <button data-v="explain"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.6 8.6 0 0 1-3.8-.9L3 21l1.9-5.3A8.4 8.4 0 1 1 21 11.5z"/></svg><span>Explique-moi</span></button>
  <button data-v="calm"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21C7 17 4 14 4 10a4.5 4.5 0 018-2.8A4.5 4.5 0 0120 10c0 4-3 7-8 11z"/></svg><span>Bien-être</span></button>
  <div id="pill" hidden role="status"></div>
  <button id="me" data-v="settings" class="ghost" style="margin-top:auto"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg><span>Réglages</span></button>
</nav>
<main id="main"></main>
<section id="bgbar" aria-label="Fond sonore">
  <button id="bg-toggle" class="bg-toggle" aria-expanded="true" aria-controls="bg-body" aria-label="Réduire le lecteur de fond sonore"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
  <span class="bg-mini" id="bg-mini"></span>
  <div class="bg-body" id="bg-body">
    <label class="bg-src"><span class="sr">Source du son</span><select id="bg-source" aria-label="Source du son"></select></label>
    <div class="bg-info"><span class="bg-art" aria-hidden="true"><img src="assets/bullo-player.png" alt="" width="40" height="40"><i class="bg-badge">🖥</i></span><span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i></span><div><strong id="bg-name">Pluie</strong><small id="bg-state" role="status">À l’arrêt</small></div></div>
    <div class="bg-ctl"><button id="bg-prev" aria-label="Son précédent" title="Son précédent">⏮</button><button id="bg-play" class="primary" aria-label="Lancer le fond sonore" aria-pressed="false">▶</button><button id="bg-next" aria-label="Son suivant" title="Son suivant">⏭</button><button id="bg-rep" class="xs" aria-label="Boucle" hidden>🔁</button><button id="bg-shuf" class="xs" aria-label="Aléatoire">🔀</button><button id="bg-fav" class="xs" aria-label="Favori">☆</button></div>
    <label class="bg-vol"><span aria-hidden="true">🔊</span><input id="bg-volume" type="range" min="0" max="1" step="0.01" value="0.5" aria-label="Volume du fond sonore"></label>
  </div>
</section>
<div id="tts-bar" role="group" aria-label="Lecture vocale" hidden><span id="tts-label" role="status"></span><button id="tts-pause" class="ghost sm" aria-pressed="false">⏸ Pause</button><button id="tts-stop" class="ghost sm">⏹ Arrêter</button></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script>
const invoke = window.__TAURI__?.core?.invoke || (async () => { throw new Error("Cette fonction nécessite l’application Bullo (Tauri)."); });
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const errText = x => (x && x.message) ? x.message : String(x);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const main = $("#main");
const APP_VERSION = "1.3.3", ABOUT_CREDIT = "Vibe codé par Renz-VASA, avec un peu d’intelligence artificielle ✨";

// Clés de stockage locales (préfixe bullo_). Les anciennes clés de la version précédente sont migrées une seule fois, puis supprimées.
const KEYS = { cfg: "bullo_cfg", tags: "bullo_tags", vers: "bullo_note_versions", draft: "bullo_draft", focus: "bullo_focus", pom: "bullo_pom_enabled", googleWhen: "bullo_google_when" };
(() => {
  const legacy = { ff_cfg: KEYS.cfg, ff_tags: KEYS.tags, ff_note_versions: KEYS.vers, ff_draft: KEYS.draft, ff_focus: KEYS.focus };
  try { for (const [o, n] of Object.entries(legacy)) { const v = localStorage.getItem(o); if (v === null) continue; if (localStorage.getItem(n) === null) localStorage.setItem(n, v); localStorage.removeItem(o); } } catch {}
})();
const TAGKEY = KEYS.tags;
const tagState = (() => { try { return JSON.parse(localStorage.getItem(TAGKEY)) || {}; } catch { return {}; } })();
const saveTags = () => { try { localStorage.setItem(TAGKEY, JSON.stringify(tagState)); } catch {} };

// ---- Messages courts (remplace alert/prompt/confirm, non fiables dans la fenêtre Tauri) ----
let toastTimer;
function notice(msg, err = false, ms = 5000) {
  const t = $("#toast"); if (!t) return;
  t.textContent = msg; t.classList.toggle("err", !!err); t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, ms);
}
function askForm(title, fields) { // fields: [{id,label,value,type}] -> Promise<{id:value}|null>
  return new Promise(res => {
    const o = document.createElement("div"); o.className = "modal"; o.setAttribute("role", "dialog"); o.setAttribute("aria-modal", "true"); o.setAttribute("aria-label", title);
    o.innerHTML = `<div class="card"><h2 style="margin-top:0">${esc(title)}</h2>${fields.map(f => `<label>${esc(f.label)}<input data-f="${f.id}" type="${f.type || "text"}" value="${esc(f.value ?? "")}"></label>`).join("")}<div class="row"><button class="primary" data-ok>Valider</button><button class="ghost" data-no>Annuler</button></div></div>`;
    const done = v => { o.remove(); res(v); };
    o.querySelector("[data-ok]").onclick = () => done(Object.fromEntries([...o.querySelectorAll("[data-f]")].map(i => [i.dataset.f, i.value])));
    o.querySelector("[data-no]").onclick = () => done(null);
    o.addEventListener("keydown", e => { if (e.key === "Escape") done(null); if (e.key === "Enter" && e.target.tagName === "INPUT") o.querySelector("[data-ok]").click(); });
    document.body.append(o); o.querySelector("input").focus();
  });
}

const idleState = { last: Date.now(), shown: false };
["pointerdown", "keydown", "input", "mousemove"].forEach(e => addEventListener(e, () => { idleState.last = Date.now(); idleState.shown = false; }, { passive: true }));
setInterval(() => {
  const m = Number(cfg?.idleMinutes) || 0;
  if (!m || idleState.shown || cap?.mr || Date.now() - idleState.last <= m * 60000) return;
  idleState.shown = true;
  const o = document.createElement("div"); o.className = "idle-pop"; o.setAttribute("role", "status");
  o.innerHTML = '<div class="card"><b>Tu es encore là ?</b><p class="mute">Une petite pause ou un nouveau départ ?</p><button class="primary">Je reprends</button></div>';
  document.body.append(o); o.querySelector("button").onclick = () => o.remove();
}, 30000);

// ---- Enregistrement de fichiers : directement dans Téléchargements (les <a download> ne sont pas fiables dans Tauri) ----
async function saveBytes(name, bytes) {
  if (window.__TAURI__) return invoke("save_download", { name, bytes: Array.from(bytes) });
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([bytes])); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); return name;
}
const stampNow = () => new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19);
async function downloadText(text, ext, prefix = "bullo-transcription") {
  try { const p = await saveBytes(`${prefix}-${stampNow()}.${ext}`, new TextEncoder().encode(text)); notice("Enregistré : " + p); }
  catch (er) { notice("Export impossible : " + errText(er), true); }
}
// PDF minimal mais correct : plusieurs pages, accents (WinAnsi), table xref exacte.
function pdfBytes(text) {
  const WIN = { "€": 0x80, "‚": 0x82, "ƒ": 0x83, "„": 0x84, "…": 0x85, "†": 0x86, "‡": 0x87, "ˆ": 0x88, "‰": 0x89, "Š": 0x8A, "‹": 0x8B, "Œ": 0x8C, "Ž": 0x8E, "‘": 0x91, "’": 0x92, "“": 0x93, "”": 0x94, "•": 0x95, "–": 0x96, "—": 0x97, "˜": 0x98, "™": 0x99, "š": 0x9A, "›": 0x9B, "œ": 0x9C, "ž": 0x9E, "Ÿ": 0x9F };
  const enc = ch => { const c = ch.charCodeAt(0); if (c < 0x20) return 0x20; if (c < 0x7f || (c >= 0xa0 && c <= 0xff)) return c; return WIN[ch] ?? 0x3f; };
  const lat = s => { let o = ""; for (const ch of s) { const c = String.fromCharCode(enc(ch)); o += (c === "\\" || c === "(" || c === ")") ? "\\" + c : c; } return o; };
  const W = 92, lines = [];
  for (const raw of String(text).replace(/\t/g, "    ").split(/\r?\n/)) {
    if (!raw.trim()) { lines.push(""); continue; }
    let cur = "";
    for (const w of raw.split(" ")) {
      if (cur && (cur + " " + w).length > W) { lines.push(cur); cur = w; } else cur = cur ? cur + " " + w : w;
      while (cur.length > W) { lines.push(cur.slice(0, W)); cur = cur.slice(W); }
    }
    lines.push(cur);
  }
  const PER = 56, pages = []; for (let i = 0; i < lines.length; i += PER) pages.push(lines.slice(i, i + PER)); if (!pages.length) pages.push([""]);
  let pdf = "%PDF-1.4\n"; const offs = [];
  const add = (n, body) => { offs[n] = pdf.length; pdf += `${n} 0 obj\n${body}\nendobj\n`; };
  add(1, "<< /Type /Catalog /Pages 2 0 R >>");
  add(2, `<< /Type /Pages /Kids [${pages.map((_, i) => `${4 + 2 * i} 0 R`).join(" ")}] /Count ${pages.length} >>`);
  add(3, "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
  pages.forEach((pl, i) => {
    const body = "BT\n/F1 10 Tf\n13 TL\n50 790 Td\n" + pl.map(l => `(${lat(l)}) Tj T*`).join("\n") + "\nET";
    add(4 + 2 * i, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R >> >> /Contents ${5 + 2 * i} 0 R >>`);
    add(5 + 2 * i, `<< /Length ${body.length} >>\nstream\n${body}\nendstream`);
  });
  const n = 3 + 2 * pages.length, x = pdf.length;
  pdf += `xref\n0 ${n + 1}\n0000000000 65535 f \n` + offs.slice(1).map(o => String(o).padStart(10, "0") + " 00000 n \n").join("") + `trailer\n<< /Size ${n + 1} /Root 1 0 R >>\nstartxref\n${x}\n%%EOF\n`;
  return Uint8Array.from(pdf, c => c.charCodeAt(0));
}
async function downloadPdf(text, prefix = "bullo-export") {
  try { const p = await saveBytes(`${prefix}-${stampNow()}.pdf`, pdfBytes(text)); notice("Enregistré : " + p); }
  catch (er) { notice("Export PDF impossible : " + errText(er), true); }
}
async function globalExport() {
  try {
    const all = await invoke("list_items", { kind: null });
    const text = "# Export Bullo\n\n" + all.map(i => i.kind === "tache" ? `- [${i.done ? "x" : " "}] ${i.title}` : `\n## ${i.title} (${i.kind})\n${i.body || ""}`).join("\n");
    await downloadText(text, "md", "bullo-global"); await downloadPdf(text, "bullo-global");
  } catch (er) { notice("Export impossible : " + errText(er), true); }
}
function tagHtml(id) { const t = tagState[id] || {}; return `<span class="tag-chip" style="--tag:${esc(/^#[0-9a-f]{3,8}$/i.test(t.color || "") ? t.color : "#4f46e5")}">${esc(t.label || "Sans tag")}</span>`; }
async function setTag(id) {
  const r = await askForm("Tag de l’élément", [{ id: "label", label: "Tag (laisser vide pour retirer)", value: tagState[id]?.label || "" }, { id: "color", label: "Couleur", type: "color", value: tagState[id]?.color || "#4f46e5" }]);
  if (!r) return;
  if (!r.label.trim()) delete tagState[id]; else tagState[id] = { label: r.label.trim(), color: r.color || "#4f46e5" };
  saveTags(); nav(view);
}

// ---- Lecture vocale (TTS) : découpée en phrases, pause/reprise/arrêt, erreurs explicites ----
const tts = { id: 0, paused: false, warned: false };
const ttsSupported = () => "speechSynthesis" in window && typeof SpeechSynthesisUtterance !== "undefined";
const ttsVoices = () => { try { return speechSynthesis.getVoices() || []; } catch { return []; } };
function ttsPick() { const all = ttsVoices(); if (cfg.ttsVoice) { const v = all.find(x => x.voiceURI === cfg.ttsVoice); if (v) return v; } return all.find(x => /^fr/i.test(x.lang)) || null; }
function ttsChunks(text) {
  const parts = String(text).replace(/\s+/g, " ").match(/[^.!?…;:]+[.!?…;:]*\s*/g) || [String(text)];
  const out = []; let cur = "";
  for (const p of parts) { if (cur && (cur + p).length > 220) { out.push(cur); cur = ""; } cur += p; }
  if (cur.trim()) out.push(cur);
  return out.map(s => s.trim()).filter(Boolean);
}
function ttsUi(label, show) {
  const b = $("#tts-bar"); if (!b) return;
  b.hidden = !show; $("#tts-label").textContent = label || "";
  const p = $("#tts-pause"); p.textContent = tts.paused ? "▶ Reprendre" : "⏸ Pause"; p.setAttribute("aria-pressed", String(tts.paused));
}
function ttsStop() { tts.id++; tts.paused = false; try { speechSynthesis.cancel(); } catch {} ttsUi("", false); }
function ttsError(code) {
  if (code === "not-allowed") return "Lecture vocale bloquée par le système.";
  if (code === "voice-unavailable" || code === "synthesis-unavailable" || code === "language-unavailable") return "Aucune voix disponible pour cette langue. Installe une voix française : Réglages Système > Accessibilité > Contenu énoncé.";
  return `Lecture vocale impossible (${code || "erreur inconnue"}).`;
}
function readAloud(text) {
  const clean = String(text || "").trim();
  if (!clean) { notice("Il n’y a pas de texte à lire.", true); return false; }
  if (!ttsSupported()) { notice("La lecture vocale n’est pas disponible sur ce système.", true); return false; }
  ttsStop();
  const myId = tts.id, voice = ttsPick(), chunks = ttsChunks(clean);
  if (!voice && ttsVoices().length && !tts.warned) { tts.warned = true; notice("Aucune voix française installée : la voix par défaut du système sera utilisée.", false, 7000); }
  chunks.forEach((c, i) => {
    const u = new SpeechSynthesisUtterance(c);
    if (voice) { u.voice = voice; u.lang = voice.lang; } else u.lang = "fr-FR";
    u.rate = clamp(Number(cfg.ttsRate) || 1, .5, 2);
    u.onstart = () => { if (myId === tts.id) ttsUi(`Lecture en cours (${i + 1}/${chunks.length})`, true); };
    u.onend = () => { if (myId === tts.id && i === chunks.length - 1) { tts.paused = false; ttsUi("", false); } };
    u.onerror = ev => { if (myId !== tts.id || ev.error === "canceled" || ev.error === "interrupted") return; ttsStop(); notice(ttsError(ev.error), true, 8000); };
    try { speechSynthesis.speak(u); } catch (er) { ttsStop(); notice(ttsError(errText(er)), true); }
  });
  ttsUi("Lecture démarrée…", true);
  return true;
}
function ttsInit() {
  $("#tts-stop").onclick = ttsStop;
  $("#tts-pause").onclick = () => { try { if (tts.paused) { speechSynthesis.resume(); tts.paused = false; } else { speechSynthesis.pause(); tts.paused = true; } } catch {} ttsUi($("#tts-label").textContent, true); };
}

// ---- Audio original : toujours relu depuis le fichier sur disque (jamais d’URL temporaire conservée) ----
const MIME = { m4a: "audio/mp4", mp4: "audio/mp4", webm: "audio/webm", wav: "audio/wav", mp3: "audio/mpeg" };
const mimeOf = p => MIME[String(p).split(".").pop().toLowerCase()] || "audio/mp4";
async function loadAudioInto(el, path) {
  if (!path) throw "Aucun enregistrement n’est associé à cet élément.";
  const raw = await invoke("read_audio", { path });
  const bytes = raw instanceof ArrayBuffer || ArrayBuffer.isView(raw) ? raw : Uint8Array.from(raw);
  if (el.dataset.url) URL.revokeObjectURL(el.dataset.url);
  el.dataset.url = URL.createObjectURL(new Blob([bytes], { type: mimeOf(path) }));
  el.src = el.dataset.url; el.load();
}
const audioErr = el => { const c = el.error; return c ? ({ 1: "Lecture interrompue.", 2: "Erreur réseau pendant la lecture.", 3: "Le fichier audio est illisible (décodage impossible).", 4: "Format audio non pris en charge par cette fenêtre." }[c.code] || "Lecture audio impossible.") : "Lecture audio impossible."; };

// ---- Pomodoro flottant (optionnel, désactivé par défaut) ----
const pom = { phase: "work", running: false, end: 0, left: null, timer: 0 };
const pomTotal = () => (pom.phase === "work" ? clamp(+cfg.pomodoro || 25, 1, 120) : clamp(+cfg.breakMinutes || 5, 1, 60)) * 60000;
const pomLeft = () => pom.running ? Math.max(0, pom.end - Date.now()) : (pom.left ?? pomTotal());
function pomTick() {
  const el = $("#pom-time"); if (!el) return;
  if (pom.running && Date.now() >= pom.end) { const was = pom.phase; pom.running = false; pom.left = null; pom.phase = was === "work" ? "break" : "work"; if (was === "work") setTimeout(exBanner, 300); notice(was === "work" ? "Pomodoro terminé : place à la pause !" : "Pause terminée : on reprend quand tu veux.", false, 8000); }
  el.textContent = fmt(Math.ceil(pomLeft() / 1000)); $("#pom-phase").textContent = pom.phase === "work" ? "Travail" : "Pause";
  $("#pom-start").disabled = pom.running; $("#pom-pause").disabled = !pom.running;
}
function setPomEnabled(on) {
  try { localStorage.setItem(KEYS.pom, String(!!on)); } catch {}
  if (on) pomWidget(); else { clearInterval(pom.timer); pom.timer = 0; const w = $("#pom-widget"); if (w) w.remove(); }
}
function pomWidget() {
  let on = false; try { on = localStorage.getItem(KEYS.pom) === "true"; } catch {}
  if (!on || $("#pom-widget")) return;
  document.body.insertAdjacentHTML("beforeend", `<aside id="pom-widget" aria-label="Pomodoro flottant"><button id="pom-mini" title="Afficher les contrôles" aria-expanded="false" aria-controls="pom-controls"><span id="pom-time">25:00</span><small id="pom-phase">Travail</small></button><div id="pom-controls" hidden><button id="pom-start" aria-label="Démarrer">▶</button><button id="pom-pause" aria-label="Pause">Ⅱ</button><button id="pom-reset" aria-label="Remettre à zéro">↺</button></div></aside>`);
  const w = $("#pom-widget"), mini = $("#pom-mini"); let drag = null, moved = false;
  mini.onpointerdown = e => { drag = { x: e.clientX - w.offsetLeft, y: e.clientY - w.offsetTop }; moved = false; mini.setPointerCapture(e.pointerId); };
  mini.onpointermove = e => { if (!drag) return; const nx = e.clientX - drag.x, ny = e.clientY - drag.y; if (Math.abs(nx - w.offsetLeft) + Math.abs(ny - w.offsetTop) > 3) moved = true; if (!moved) return; w.style.left = clamp(nx, 4, innerWidth - w.offsetWidth - 4) + "px"; w.style.top = clamp(ny, 4, innerHeight - w.offsetHeight - 4) + "px"; w.style.right = "auto"; };
  mini.onpointerup = () => { drag = null; };
  mini.onclick = () => { if (moved) { moved = false; return; } const c = $("#pom-controls"); c.hidden = !c.hidden; mini.setAttribute("aria-expanded", String(!c.hidden)); };
  $("#pom-start").onclick = () => { if (pom.running) return; pom.end = Date.now() + (pom.left ?? pomTotal()); pom.running = true; pomTick(); };
  $("#pom-pause").onclick = () => { if (!pom.running) return; pom.left = Math.max(0, pom.end - Date.now()); pom.running = false; pomTick(); };
  $("#pom-reset").onclick = () => { pom.running = false; pom.left = null; pom.phase = "work"; pomTick(); };
  clearInterval(pom.timer); pom.timer = setInterval(pomTick, 500); pomTick();
}

async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; }
  catch { const a = document.createElement("textarea"); a.value = t; a.style.cssText = "position:fixed;opacity:0"; document.body.append(a); a.select(); let ok = false; try { ok = document.execCommand("copy"); } catch {} a.remove(); return ok; }
}

// Les dates SQLite sont en UTC (« 2026-10-01 14:32:05 ») : on les affiche en heure locale, façon « Aujourd'hui · 14:32 ».
function when(created) {
  const d = new Date(String(created).replace(" ", "T") + "Z"); if (isNaN(d)) return "";
  const day = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()), diff = Math.round((day(new Date()) - day(d)) / 864e5);
  const h = d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  const dd = diff === 0 ? "Aujourd'hui" : diff === 1 ? "Hier" : d.toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: d.getFullYear() === new Date().getFullYear() ? undefined : "numeric" });
  return `${dd} · ${h}`;
}

function bindList() {

    if (b.dataset.sure) return run();

    setTimeout(() => { delete b.dataset.sure; b.classList.remove("sure"); b.innerHTML = old; }, 3500);
  };
  main.querySelectorAll("[data-tag]").forEach(b => b.onclick=()=>setTag(b.dataset.tag));
  main.querySelectorAll(".item").forEach(el => {
    const id = +el.dataset.id, cb = $("input[type=checkbox]", el), del = $("[data-del]", el);
    if (cb) cb.onchange = () => invoke("set_done", { id, done: cb.checked });
    if (del) del.onclick = async () => { await invoke("delete_item", { id }); nav(view); };
    const more = $("[data-more]", el);
    if (more) more.onclick = () => {
      const open = more.getAttribute("aria-expanded") !== "true";
      $(".body-full", el).hidden = !open; $(".body-ex", el).hidden = open;
      more.setAttribute("aria-expanded", String(open)); more.textContent = open ? "Réduire" : "Lire la suite";
    };

  });
  main.querySelectorAll(".course").forEach(el => {
    const id = +el.dataset.id, au = $("audio", el);
    confirmDel($("[data-del]", el), async () => { await invoke("delete_item", { id }); nav(view); });
    el.querySelectorAll("[data-p]").forEach(b => b.onclick = async () => {
      const open = b.getAttribute("aria-expanded") !== "true";
      el.querySelectorAll("[data-p]").forEach(x => x.setAttribute("aria-expanded", "false"));
      el.querySelectorAll(".panel").forEach(x => x.hidden = true);

}

const cap = { audio: null, mr: null, t0: 0, busy: "", msg: "Ou colle directement un texte ci-dessous.", err: false, text: "", result: null };

// Le modèle d'IA renvoie parfois une forme inattendue (une phrase au lieu d'une liste, un objet…). On remet tout au propre,
// sinon une seule réponse bizarre, sauvegardée dans le brouillon, empêcherait d'ouvrir la page Capturer.
function asList(v) {
  if (v == null || v === "") return [];
  if (Array.isArray(v)) return v.map(x => typeof x === "string" ? x : (x && typeof x === "object" ? Object.values(x).filter(y => typeof y === "string" || typeof y === "number").join(" · ") || JSON.stringify(x) : String(x))).filter(x => x.trim());
  if (typeof v === "object") return asList(Object.values(v));
  return String(v).split(/\n+/).map(x => x.replace(/^[-•*\d.)\s]+/, "").trim()).filter(Boolean);
}
function normResult(r) {
  if (!r || typeof r !== "object" || Array.isArray(r)) return null;
  const resume = typeof r.resume === "string" ? r.resume : asList(r.resume).join(" ");
  return { resume, a_retenir: asList(r.a_retenir), taches: asList(r.taches), echeances: asList(r.echeances), questions: asList(r.questions) };
}

// L’enregistrement du micro ne doit pas capter les haut-parleurs : on coupe TOUT le son de l’ordinateur (navigateur, Spotify, Music…),
// on met Music/Spotify en pause, puis on remet exactement comme avant à l’arrêt. Réglable dans Réglages > Fond sonore.
async function recMute() {
  rec.paused = []; rec.muted = false;
  let before;
  try { before = await invoke("system_audio"); } catch (er) { notice("Impossible de couper le son de l’ordinateur : " + errText(er), true, 7000); return; }
  const np = await invoke("now_playing").catch(() => null);
  if (np && np.state === "playing" && np.kind !== "none") { const app = np.kind === "app" ? np.app : "system"; rec.paused.push(app); await invoke("media_control", { app, action: app === "system" ? "playpause" : "pause" }).catch(() => {}); }
  if (!before.muted) {
    try { await invoke("system_mute", { muted: true }); rec.muted = true; try { localStorage.setItem(RECMUTE, "1"); } catch {} }
    catch (er) { notice("Impossible de couper le son de l’ordinateur : " + errText(er), true, 7000); }
  }
}
async function recRestore() {

  if (rec.muted) { await invoke("system_mute", { muted: false }).catch(() => {}); rec.muted = false; try { localStorage.removeItem(RECMUTE); } catch {} }
  const apps = rec.paused; rec.paused = [];

  if (isExt()) setTimeout(extPoll, 500);
}
function bgOnRecord(start) {
  if (start) {
    if (!cfg.bgPauseOnRec) return;
    if (bg.playing) { bg.resumeAfterRec = true; bgPause(); }
    if (hasTauri()) rec.p = recMute();
  } else {
    if (bg.resumeAfterRec) { bg.resumeAfterRec = false; bgPlay(); }
    if (hasTauri() && rec.p) { recRestore().then(() => { rec.p = null; }); }
  }
}

const DEF = {
  mods: Object.fromEntries(MOD_IDS.map(i => [i, true])), onboarded: false, pinHint: "",
  font: "body", size: 18, lh: 1.6, letter: 0, theme: "auto", accent: "#5b4bf5", contrast: false, colorblind: "none", soft: false, reduceMotion: false, mask: false,

const FONT_DEFS = [

  { id: "atkinson", label: "Atkinson Hyperlegible (basse vision)", family: "Atkinson Hyperlegible", loadable: true, extra: true, hint: "elle se télécharge depuis Réglages > Apparence" },
  { id: "verdana", label: "Verdana", family: "Verdana", system: true },

const fontDef = id => FONT_DEFS.find(f => f.id === id) || FONT_DEFS[0];
const fontStack = d => d.family === "system-ui" ? "system-ui, sans-serif" : `"${d.family}", Verdana, sans-serif`;
const fontOk = {}; // id -> true/false une fois vérifié
let fontCtx;
function sysFontInstalled(name) {
  fontCtx ||= document.createElement("canvas").getContext("2d");
  const t = "mmmmmmmmmmlli wWÉéçœ", w = f => { fontCtx.font = `72px ${f}`; return fontCtx.measureText(t).width; };
  return ["monospace", "serif", "sans-serif"].some(b => w(`"${name}", ${b}`) !== w(b));

// Polices téléchargées depuis l'appli : stockées dans le dossier de données de Bullo, chargées au démarrage via FontFace.
const APP_FONTS = { "lexend-400.woff2": ["Lexend", "400", "lexend"], "lexend-700.woff2": ["Lexend", "700", "lexend"], "atkinson-400.woff2": ["Atkinson Hyperlegible", "400", "atkinson"], "atkinson-700.woff2": ["Atkinson Hyperlegible", "700", "atkinson"] };
const extraLoaded = new Set();
async function loadAppFonts() {
  if (!window.__TAURI__) return;
  let files = []; try { files = await invoke("list_fonts"); } catch { return; }
  for (const f of files) {
    const def = APP_FONTS[f]; if (!def) continue;
    try {
      const raw = await invoke("read_font", { file: f });
      const bytes = raw instanceof ArrayBuffer || ArrayBuffer.isView(raw) ? raw : Uint8Array.from(raw);
      const face = new FontFace(def[0], bytes, { weight: def[1] }); await face.load(); document.fonts.add(face); extraLoaded.add(def[2]);
    } catch (er) { console.warn("Police illisible :", f, errText(er)); }
  }
}
let fontsReady = Promise.resolve();
async function checkFont(d) {
  if (d.always) return true;
  if (d.extra && !extraLoaded.has(d.id)) return false; // police téléchargeable : disponible seulement une fois installée
  if (d.system) return sysFontInstalled(d.family);
  const same = f => f.family.replace(/["']/g, "") === d.family;
  const test = async () => {
    let got = []; try { got = await document.fonts.load(`400 16px "${d.family}"`, "Aé"); } catch {} // une règle CSS en erreur ne doit pas masquer les autres
    return (got.length > 0 && got.every(f => f.status === "loaded")) || [...document.fonts].some(f => same(f) && f.status === "loaded");
  };
  if (await test()) return true;
  if (d.loadable && !d.extra) { await new Promise(r => setTimeout(r, 700)); return test(); } // police livrée avec l'appli : on laisse au moteur le temps de la charger
  return false;
}
async function checkAllFonts() { await Promise.all(FONT_DEFS.map(async d => { fontOk[d.id] = await checkFont(d); })); return fontOk; }

const PALETTES = { // palettes sûres (Okabe-Ito) : on ne se fie jamais à la seule couleur

  protanopia: { light: ["#0072b2", "#e69f00", "#d55e00"], dark: ["#56b4e9", "#f0e442", "#e69f00"] },
  tritanopia: { light: ["#cc3311", "#009988", "#882255"], dark: ["#ee7733", "#33bbee", "#ee3377"] }

const lum = hex => { const c = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255).map(v => v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4); return .2126 * c[0] + .7152 * c[1] + .0722 * c[2]; };

const saveCfg = () => { try { localStorage.setItem(KEYS.cfg, JSON.stringify(cfg)); } catch {} };

  r.setProperty("--fs", cfg.size + "px"); r.setProperty("--lh", cfg.lh); r.setProperty("--letter", cfg.letter + "px");

  R.dataset.theme = cfg.theme; R.dataset.colorblind = cfg.colorblind || "none";
  const pal = !cfg.contrast && PALETTES[cfg.colorblind], custom = !["#4f46e5", DEF.accent].includes(String(cfg.accent).toLowerCase());
  let acc = null, acc2 = null, rec = null;
  if (pal) [acc, acc2, rec] = pal[isDark() ? "dark" : "light"]; else if (custom && !cfg.contrast) acc = cfg.accent;
  for (const [k, v] of [["--accent", acc], ["--accent2", acc2], ["--rec", rec], ["--on", acc ? (lum(acc) > .4 ? "#0d1017" : "#ffffff") : null]]) v ? r.setProperty(k, v) : r.removeProperty(k);
  document.querySelectorAll("nav [data-v]").forEach(b => { b.hidden = !modOn(b.dataset.v); });

}
try {
  const raw = JSON.parse(localStorage.getItem(KEYS.cfg));

const sha = async t => [...new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)))].map(b => b.toString(16).padStart(2, "0")).join("");
// Salutation selon l’heure ; le prénom du profil est ajouté s’il existe.
function greet(h = new Date().getHours()) {
  const hello = h >= 5 && h < 18 ? "Bonjour" : "Bonsoir";
  const wish = h >= 5 && h < 12 ? "Bonne matinée" : h >= 12 && h < 18 ? "Bon après-midi" : h >= 18 && h < 22 ? "Bonne soirée" : "Pense à te reposer";
  return { title: hello + (cfg.name ? " " + cfg.name : ""), wish };
}
function lock() {
  if (!cfg.pin || $("#lock")) return;
  const o = document.createElement("div"); o.id = "lock";
  o.innerHTML = `<div class="card"><h1>${esc(greet().title)}</h1><input type="password" inputmode="numeric" placeholder="Code" aria-label="Code"><p class="msg err" role="alert"></p>${cfg.pinHint ? `<p class="mute">Indice : ${esc(cfg.pinHint)}</p>` : ""}</div>`;
  document.body.append(o); const i = o.querySelector("input"); i.focus();
  i.oninput = async () => { if (await sha(i.value) === cfg.pin) o.remove(); else o.querySelector("p").textContent = i.value.length >= 4 ? "Code incorrect" : ""; };

// ===== Première ouverture : choisir ce qu’on affiche, un prénom, et (si on veut) un code d’accès. Tout reste sur cet ordinateur. =====
function welcome(again) {
  if ($("#welcome")) return;
  const o = document.createElement("div"); o.id = "welcome"; o.setAttribute("role", "dialog"); o.setAttribute("aria-modal", "true"); o.setAttribute("aria-labelledby", "wTitle");

    if (!skip && st.pin) {
      if (!/^\d{4,}$/.test(st.pin)) { st.err = "Le code doit faire au moins 4 chiffres (ou laisse la case vide)."; return draw(); }
      if (st.pin !== st.pin2) { st.err = "Les deux codes ne sont pas identiques."; return draw(); }
      try { cfg.pin = await sha(st.pin); cfg.pinHint = st.hint.trim(); } catch { st.err = "Impossible d’enregistrer le code sur ce système."; return draw(); }
    }
    if (!skip) { cfg.name = st.name.trim().slice(0, 40); cfg.mods = { ...st.mods }; }
    cfg.onboarded = true; applyCfg(); o.remove();
    if (again) settings(); else nav("home");
    if (skip) notice("Tout est affiché. Tu peux changer ça dans Réglages › Profil.");
  };

    if (st.step === 0) body = `<h1 id="wTitle">Bienvenue dans Bullo</h1>
      <p class="lead">Un espace calme pour capter une idée, un cours ou une tâche. Tout reste sur cet ordinateur : il n’y a pas de compte en ligne.</p>

      <div class="row"><button class="primary" id="wNext">Suivant</button><button class="ghost" id="wSkip">Passer et tout afficher</button></div>`;
    else if (st.step === 1) body = `<h1 id="wTitle">Qu’est-ce que tu veux voir ?</h1>
      <p class="lead">Cache ce qui ne te sert pas, ça allège l’écran. Tu pourras tout changer plus tard dans Réglages.</p>
      <div class="row chips" role="group" aria-label="Choix rapides"><button class="chip" data-pre="essential">L’essentiel</button><button class="chip" data-pre="student">Études</button><button class="chip" data-pre="all">Tout</button></div>
      <p class="mute">Toujours présents : Accueil, Capturer, Inbox, Réglages.</p>
      <div class="mods">${MODS.map(([id, l, d]) => `<label class="chk mod"><input type="checkbox" data-wmod="${id}" ${st.mods[id] !== false ? "checked" : ""}> <span><b>${esc(l)}</b><small class="mute">${esc(d)}</small></span></label>`).join("")}</div>
      <div class="row"><button class="ghost" id="wBack">Retour</button><button class="primary" id="wNext">Suivant</button></div>`;
    else body = `<h1 id="wTitle">Un code d’accès ? (facultatif)</h1>

      <label>Même code encore une fois<input id="wPin2" type="password" inputmode="numeric" autocomplete="off" value="${esc(st.pin2)}"></label>
      <label>Indice (facultatif, visible à l’ouverture)<input id="wHint" maxlength="80" autocomplete="off" value="${esc(st.hint)}"></label>

    const g = id => o.querySelector("#" + id);
    const val = () => { if (g("wName")) st.name = g("wName").value; if (g("wPin")) { st.pin = g("wPin").value; st.pin2 = g("wPin2").value; st.hint = g("wHint").value; } };
    o.querySelectorAll("[data-wmod]").forEach(c => c.onchange = () => { st.mods[c.dataset.wmod] = c.checked; });

}

// ---- Mises à jour : on regarde la dernière version publiée sur GitHub. Bullo n'est pas signé par Apple : on ouvre la page de téléchargement, on n'installe rien en cachette. ----
const UPDATE_KEY = "bullo_update_check";

    try { localStorage.setItem(UPDATE_KEY, JSON.stringify({ at: Date.now(), latest: u.latest, url: u.url, newer: u.newer })); } catch {}

async function installUpdate(u, btn, out) {

function startupUpdateCheck() {
  if (!cfg.checkUpdates) return;
  let last = {}; try { last = JSON.parse(localStorage.getItem(UPDATE_KEY)) || {}; } catch {}
  if (last.at && Date.now() - last.at < 864e5) { if (last.newer) appVersion().then(v => updBanner({ latest: last.latest, url: last.url, current: v })); return; }

const RESERVED = "Ctrl+K"; // toujours réservé à « Rechercher »
function comboOf(e) {
  if (["Control", "Meta", "Alt", "Shift", "AltGraph"].includes(e.key)) return "";
  const m = []; if (e.ctrlKey || e.metaKey) m.push("Ctrl"); if (e.altKey) m.push("Alt"); if (e.shiftKey) m.push("Shift");
  let k = e.code?.startsWith("Key") ? e.code.slice(3) : e.code?.startsWith("Digit") ? e.code.slice(5) : e.key;
  if (k === " ") k = "Space"; if (k.length === 1) k = k.toUpperCase();
  return [...m, k].join("+");
}

  if (cap.result && view === "capture") return [cap.result.resume, ...(cap.result.a_retenir || [])].filter(Boolean).join(". ");

const MONTHS = ["janvier","fevrier","mars","avril","mai","juin","juillet","aout","septembre","octobre","novembre","decembre"];

function parseDateFr(text, now = new Date()) {

  }

  else if (/\bdemain\b/.test(t)) { d.setDate(d.getDate() + 1); found = true; }

  else if ((m = t.match(/\b(\d{1,2})\s*\/\s*(\d{1,2})(?:\s*\/\s*(\d{2,4}))?\b/)) && +m[1] >= 1 && +m[1] <= 31 && +m[2] >= 1 && +m[2] <= 12) {

// Filet de sécurité : si le système bloque les notifications, Bullo affiche quand même le rappel à l’écran.

}

const TOOLS = {
  corriger: ["Corriger", "Orthographe et grammaire, sans changer ton sens.", "Version corrigée"],
  simplifier: ["Simplifier", "Un texte compliqué, expliqué en clair.", "En clair"],
  decomposer: ["Décomposer", "Une grosse tâche en petites étapes.", "Étapes"],
  bloque: ["Je suis bloqué", "Une seule petite première action.", "Première petite action"],
  consigne: ["Consigne de devoir", "Ce qu'il faut rendre, et pour quand.", "Ce que je dois faire"],
  reviser: ["Réviser", "Des questions pour tester ce que tu sais.", "Questions de révision"]
};
const TLK = "bullo_tools";
const tl = { text: "", out: "", mode: "", busy: false, err: false };
try { const d = JSON.parse(localStorage.getItem(TLK)); if (d) { tl.text = String(d.text || ""); tl.out = String(d.out || ""); tl.mode = TOOLS[d.mode] ? d.mode : ""; tl.err = !!d.err; if (d.pending && TOOLS[d.mode]) { tl.out = "Bullo s’est fermé pendant l’analyse : clique à nouveau sur l’outil pour la relancer."; tl.err = true; } } } catch {}
const saveTl = () => { try { localStorage.setItem(TLK, JSON.stringify({ text: tl.text, out: tl.out, mode: tl.mode, err: tl.err, pending: tl.busy })); } catch {} };
const stepLines = t => t.split("\n").map(x => x.trim().replace(/^(\d+\s*[.)]|[-•*])\s*/, "")).filter(Boolean);
function qa(t) { // « 1. Question … Réponse : … » → cartes à déplier
  const it = t.split(/\n\s*(?=\d+\s*[.)])/).map(b => b.trim()).filter(Boolean).map(b => {
    const m = b.split(/Réponse\s*:/i); return m.length > 1 ? [m[0].replace(/^\d+\s*[.)]\s*/, "").trim(), m.slice(1).join("").trim()] : null; });
  return it.length && it.every(Boolean) ? it : null;
}
// Erreur « il manque un outil » : « [[install:xxx]] message » -> texte + bouton « Installer et réessayer ».
const installCode = t => (String(t).match(/^\[\[install:([a-z-]+)\]\]/) || [])[1] || "";
const stripCode = t => String(t).replace(/^\[\[install:[a-z-]+\]\]/, "");

  if (tl.busy) return `<div class="card" role="status" aria-live="polite"><div class="sk"></div><div class="sk"></div><div class="sk s"></div><p class="msg" style="margin-bottom:0">Analyse en cours… Tu peux changer d'onglet, ça continue.</p></div>`;
  if (!tl.out) return "";

    : q ? `<div class="qa">${q.map(([a, r], i) => `<details><summary><span class="n">${i + 1}</span><span>${esc(a)}</span></summary><p>${esc(r)}</p></details>`).join("")}</div><p class="msg">Réponds dans ta tête, puis déplie pour vérifier.</p>`
    : `<div class="out">${esc(tl.out)}</div>`;
  return `<div class="card res"><h2 style="margin-top:0">${TOOLS[m][2]}</h2>${body}
    <div class="row"><button class="primary sm" id="cp">${ico("copy")}<span>Copier</span></button><button class="ghost sm" id="exportout">Exporter (.txt)</button><button class="ghost sm" id="savenoteout">Enregistrer comme note</button>

}

// ===== « Explique-moi » (méthode Feynman) =====

const ex = { page: "start", topic: "", text: "", ans: "", turns: [], bilan: null, id: null, busy: "", err: "", mr: null, dictating: "", dictMsg: "", open: null, confirm: null, list: [] };

function exReset() { Object.assign(ex, { page: "start", topic: "", text: "", ans: "", turns: [], bilan: null, id: null, busy: "", err: "", dictMsg: "", open: null, confirm: null }); }
function exOpen(topic) { if (ex.busy || ex.mr) { nav("explain"); return; } if (ex.page === "bilan" || ex.page === "history") exReset(); if (topic && ex.page === "start" && !ex.topic) ex.topic = topic; nav("explain"); }

// Messages envoyés au modèle : l'explication, puis chaque question / réponse déjà échangée.
function exMessages() {
  const m = [{ role: "user", content: `Sujet : ${ex.topic}\n\nMon explication :\n${ex.text}` }];
  for (const t of ex.turns) { m.push({ role: "assistant", content: t.q }); if (t.a) m.push({ role: "user", content: t.a }); }
  return m;
}
// Message clair et bienveillant, sans jargon, quand Ollama n'est pas prêt.
function exFriendly(er) {
  const t = errText(er);
  if (/Ollama ne répond pas/i.test(t)) return "Cette fonctionnalité a besoin d’Ollama. Ouvre l’application Ollama, puis réessaie.";
  if (/mod[èe]le/i.test(t) && /pas t[ée]l[ée]charg/i.test(t)) return "Le modèle de résumé n’est pas encore téléchargé. Va dans Réglages, « Vérifier les outils », puis « Télécharger ». Ensuite, réessaie.";
  return t;
}
function parseBilan(raw) {
  const t = String(raw || "").replace(/\r/g, ""), i = t.search(/[àa]\s*revoir\s*:?/i);
  const items = s => s.split("\n").map(x => x.replace(/^[\s\-–•*·\d.)]+/, "").replace(/\*\*/g, "").trim()).filter(Boolean);
  const head = i >= 0 ? t.slice(0, i) : t, tail = i >= 0 ? t.slice(i).replace(/^[àa]\s*revoir\s*:?\**/i, "") : "";
  const solide = items(head.replace(/^[\s*_#]*solide\s*:?\**/i, "")), revoir = items(tail);
  return solide.length || revoir.length ? { solide, revoir } : { solide: [t.trim()].filter(Boolean), revoir: [] };
}
const exSave = async () => {
  try { ex.id = await invoke("explain_save", { id: ex.id, topic: ex.topic, explanation: ex.text, turns: JSON.stringify(ex.turns), bilan: ex.bilan ? JSON.stringify(ex.bilan) : "" }); }
  catch (er) { notice("Séance non sauvegardée : " + errText(er), true); }
};
const exRender = () => { if (view === "explain") explainView(); };

async function exStart() {
  if (ex.busy) return;
  ex.topic = ex.topic.trim(); ex.text = ex.text.trim();
  if (!ex.topic) { ex.err = "Écris d’abord le sujet (quelques mots)."; return exRender(); }
  if (ex.text.length < EX_MIN_CHARS) { ex.err = "Ton explication est très courte : écris-en un peu plus pour que je puisse poser de bonnes questions."; return exRender(); }
  ex.err = ""; ex.turns = []; ex.bilan = null; ex.id = null; await exAsk();
}
// Demande la prochaine série de questions. L'état est gardé hors de l'écran : on peut changer de page pendant que le modèle réfléchit.
async function exAsk() {
  ex.busy = "Je réfléchis à tes explications…"; ex.err = ""; exRender();
  try {
    const q = await invoke("explain_turn", { topic: ex.topic, messages: exMessages(), bilan: false });
    ex.turns.push({ q, a: "" }); ex.ans = ""; ex.page = "talk"; ex.busy = ""; await exSave();
    if (view !== "explain") notice("Une question t’attend dans Explique-moi.", false, 6000);
  } catch (er) { ex.busy = ""; ex.err = exFriendly(er); }
  exRender();
}
async function exAnswer() {
  if (ex.busy) return;
  const a = ex.ans.trim(); if (!a) { ex.err = "Écris (ou dicte) ta réponse, ou termine avec le bilan."; return exRender(); }
  ex.turns[ex.turns.length - 1].a = a; ex.err = "";
  if (ex.turns.length >= EX_MAX_ROUNDS) return exFinish();
  await exAsk();
}
async function exFinish() {
  if (ex.busy) return;
  const last = ex.turns[ex.turns.length - 1]; if (last && !last.a && ex.ans.trim()) last.a = ex.ans.trim();
  ex.busy = "Je prépare ton bilan…"; ex.err = ""; exRender();
  try {
    const raw = await invoke("explain_turn", { topic: ex.topic, messages: exMessages(), bilan: true });
    ex.bilan = parseBilan(raw); ex.page = "bilan"; ex.busy = ""; await exSave();
  } catch (er) { ex.busy = ""; ex.err = exFriendly(er); }
  exRender();
}
// Arrêter à tout moment : on garde ce qui a été fait, sans bilan.
async function exStop() {
  if (ex.busy) return;
  const last = ex.turns[ex.turns.length - 1]; if (last && !last.a && ex.ans.trim()) last.a = ex.ans.trim();
  if (ex.turns.length) await exSave();
  exReset(); exRender();
}

// Dictée : on réutilise l'enregistrement et la transcription locale déjà présents dans Bullo (save_audio + transcribe).
async function exDictate(target) {
  if (ex.mr) { ex.mr.stop(); return; }
  if (ex.busy || ex.dictating) return;
  if (!navigator.mediaDevices?.getUserMedia || typeof MediaRecorder === "undefined") { ex.dictMsg = "L’enregistrement n’est pas disponible dans cette fenêtre."; return exRender(); }
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mime = ["audio/mp4", "audio/webm;codecs=opus", "audio/webm"].find(m => MediaRecorder.isTypeSupported(m)) || "";
    const mr = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream), chunks = [], type = mr.mimeType || mime || "audio/webm";
    mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    mr.onerror = () => { stream.getTracks().forEach(t => t.stop()); ex.mr = null; bgOnRecord(false); ex.dictMsg = "L’enregistrement a rencontré une erreur."; exRender(); };
    mr.onstop = async () => {
      stream.getTracks().forEach(t => t.stop()); ex.mr = null; bgOnRecord(false);
      if (!chunks.length) { ex.dictMsg = "Aucun son n’a été enregistré."; return exRender(); }
      ex.dictating = target; ex.dictMsg = "Transcription en cours…"; exRender();
      try {
        const bytes = new Uint8Array(await new Blob(chunks, { type }).arrayBuffer());
        const path = await invoke("save_audio", bytes, { headers: { "x-ext": type.includes("mp4") ? "m4a" : "webm" } });
        const txt = (await invoke("transcribe", { path })).trim();
        if (!txt) ex.dictMsg = "Je n’ai rien entendu. Réessaie, un peu plus près du micro.";
        else { const k = target === "ans" ? "ans" : "text"; ex[k] = (ex[k] ? ex[k].trimEnd() + " " : "") + txt; ex.dictMsg = "Transcription ajoutée : relis-la et corrige-la si besoin."; }
      } catch (er) { ex.dictMsg = errText(er); }
      ex.dictating = ""; exRender();
    };
    bgOnRecord(true); mr.start(); ex.mr = mr; ex.dictMsg = "Enregistrement en cours… clique à nouveau pour terminer."; exRender();
  } catch (er) {
    if (stream) stream.getTracks().forEach(t => t.stop());
    ex.dictMsg = stream ? "L’enregistrement n’a pas pu démarrer : " + errText(er) : "Micro inaccessible. Autorise-le dans Réglages Système > Confidentialité > Micro."; exRender();
  }
}

const exDictBtn = target => `<button class="ghost" data-dict="${target}" aria-pressed="${!!ex.mr}" ${ex.busy || ex.dictating ? "disabled" : ""}>${ex.mr ? "⏹ Terminer l’enregistrement" : "🎙 Dicter à l’oral"}</button>`;
const exList = (title, a) => a && a.length ? `<h3>${title}</h3><ul>${a.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "";
const exBilanHtml = b => `<div class="card ex-bilan"><h2 style="margin-top:0">Ton bilan</h2>${exList("✅ Solide", b.solide)}${exList("🔎 À revoir", b.revoir)}<div class="row"><button class="ghost" id="exSpeakBilan">🔊 Écouter le bilan</button></div></div>`;
const exBilanOf = s => { try { return s ? JSON.parse(s) : null; } catch { return null; } };
const exTurnsOf = s => { try { const a = JSON.parse(s); return Array.isArray(a) ? a : []; } catch { return []; } };

async function explainView() {
  const err = ex.err ? `<p class="msg err" role="alert">${esc(ex.err)}</p>` : "", busy = ex.busy ? `<p class="msg ex-busy" role="status"><span class="spin" aria-hidden="true"></span>${esc(ex.busy)}</p>` : "";
  const dm = ex.dictMsg ? `<p class="msg" role="status">${esc(ex.dictMsg)}</p>` : "";
  const tabs = `<div class="row ex-tabs" role="tablist"><button class="chip ${ex.page === "history" ? "" : "on"}" data-pg="start" aria-pressed="${ex.page !== "history"}">Expliquer</button><button class="chip ${ex.page === "history" ? "on" : ""}" data-pg="history" aria-pressed="${ex.page === "history"}">Mes explications</button></div>`;
  let body = "";
  if (ex.page === "history") {
    try { ex.list = await invoke("explain_list"); } catch (er) { ex.list = []; ex.err = errText(er); }
    if (view !== "explain") return;
    body = `<p class="mute lead">Tes séances passées. Elles restent sur cet ordinateur.</p>` + (ex.list.length ? ex.list.map(s => {
      const open = ex.open === s.id, turns = exTurnsOf(s.turns), b = exBilanOf(s.bilan);
      return `<div class="card ex-item"><div class="row" style="align-items:center"><button class="ghost ex-head" data-open="${s.id}" aria-expanded="${open}"><b>${esc(s.topic || "Sans sujet")}</b><small class="mute">${esc(when(s.created))} · ${turns.length} série${turns.length > 1 ? "s" : ""} de questions${b ? " · bilan fait" : ""}</small></button>
        ${ex.confirm === s.id ? `<button class="ghost danger" data-delyes="${s.id}">Confirmer la suppression</button><button class="ghost" data-delno>Annuler</button>` : `<button class="ghost danger" data-del="${s.id}" aria-label="Supprimer la séance ${esc(s.topic)}">${ico("trash")}<span>Supprimer</span></button>`}</div>
        ${open ? `<div class="ex-detail"><h3>Mon explication</h3><p>${esc(s.explanation)}</p>${turns.map((t, i) => `<h3>Question ${i + 1}</h3><p>${esc(t.q)}</p>${t.a ? `<h3>Ma réponse</h3><p>${esc(t.a)}</p>` : ""}`).join("")}${b ? `<h3>Bilan</h3>${exList("✅ Solide", b.solide)}${exList("🔎 À revoir", b.revoir)}` : `<p class="mute">Séance arrêtée avant le bilan.</p>`}</div>` : ""}</div>`;
    }).join("") : `<p class="mute">Aucune explication pour l’instant. Lance ta première avec « Expliquer ».</p>`);
  } else if (ex.page === "start") {
    body = `<p class="mute lead">Explique avec tes mots ce que tu viens d’apprendre. Un élève curieux te posera des questions sur ce qui n’est pas clair. Il ne donne jamais la réponse : c’est toi qui cherches.</p>
      <div class="card ex-card"><label for="exTopic">Le sujet</label><input id="exTopic" maxlength="120" placeholder="Ex. : la photosynthèse" value="${esc(ex.topic)}" ${ex.busy ? "disabled" : ""}>
      <label for="exText">Ton explication</label><textarea id="exText" rows="8" placeholder="Écris ici comme si tu l’expliquais à quelqu’un qui découvre le sujet…" ${ex.busy ? "disabled" : ""}>${esc(ex.text)}</textarea>
      <div class="row">${exDictBtn("text")}</div>${dm}${err}${busy}
      <div class="row"><button class="primary" id="exGo" ${ex.busy || ex.mr ? "disabled" : ""}>Commencer</button></div></div>`;
  } else if (ex.page === "talk") {
    const i = ex.turns.length, cur = ex.turns[i - 1];
    body = `<p class="mute lead">Série ${i} sur ${EX_MAX_ROUNDS} · tu peux t’arrêter quand tu veux.</p>
      <details class="card ex-card"><summary>Voir mon explication (${esc(ex.topic)})</summary><p>${esc(ex.text)}</p></details>
      ${ex.turns.slice(0, -1).map((t, k) => `<div class="card ex-past"><h3>Série ${k + 1}</h3><p class="ex-q">${esc(t.q)}</p><p class="mute"><b>Ma réponse :</b> ${esc(t.a)}</p></div>`).join("")}
      <div class="card ex-card" aria-live="polite"><h2 style="margin-top:0">L’élève demande</h2><p class="ex-q" id="exQ">${esc(cur.q)}</p><div class="row"><button class="ghost" id="exSpeak">🔊 Écouter les questions</button></div>
      <label for="exAns">Ta réponse</label><textarea id="exAns" rows="5" placeholder="Réponds avec tes mots…" ${ex.busy ? "disabled" : ""}>${esc(ex.ans)}</textarea>
      <div class="row">${exDictBtn("ans")}</div>${dm}${err}${busy}
      <div class="row"><button class="primary" id="exSend" ${ex.busy || ex.mr ? "disabled" : ""}>${i >= EX_MAX_ROUNDS ? "Répondre et voir le bilan" : "Répondre"}</button><button class="ghost" id="exBilan" ${ex.busy || ex.mr ? "disabled" : ""}>Voir mon bilan</button><button class="ghost" id="exStop" ${ex.busy ? "disabled" : ""}>Arrêter</button></div></div>`;
  } else {
    body = `${exBilanHtml(ex.bilan || { solide: [], revoir: [] })}<div class="row"><button class="primary" id="exNew">Nouvelle explication</button><button class="ghost" data-pg="history">Mes explications</button></div>`;
  }
  main.innerHTML = `<h1>Explique-moi</h1>${ex.page === "bilan" ? "" : tabs}${body}`;
  main.querySelectorAll("[data-pg]").forEach(b => b.onclick = () => { if (ex.busy || ex.mr) return; if (b.dataset.pg === "history") ex.page = "history"; else if (ex.page === "history") ex.page = ex.turns.length && !ex.bilan ? "talk" : (ex.bilan ? "bilan" : "start"); ex.err = ""; explainView(); });
  const keep = (id, k) => { const el = $(id); if (el) el.oninput = () => { ex[k] = el.value; }; };
  keep("#exTopic", "topic"); keep("#exText", "text"); keep("#exAns", "ans");
  main.querySelectorAll("[data-dict]").forEach(b => b.onclick = () => exDictate(b.dataset.dict));
  const on = (id, f) => { const el = $(id); if (el) el.onclick = f; };
  on("#exGo", exStart); on("#exSend", exAnswer); on("#exBilan", exFinish); on("#exStop", exStop);
  on("#exNew", () => { exReset(); explainView(); });
  on("#exSpeak", () => readAloud(ex.turns[ex.turns.length - 1].q));
  on("#exSpeakBilan", () => readAloud([...(ex.bilan.solide || []).map(x => "Solide : " + x), ...(ex.bilan.revoir || []).map(x => "À revoir : " + x)].join(". ")));
  main.querySelectorAll("[data-open]").forEach(b => b.onclick = () => { ex.open = ex.open === +b.dataset.open ? null : +b.dataset.open; explainView(); });
  main.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { ex.confirm = +b.dataset.del; explainView(); });
  main.querySelectorAll("[data-delno]").forEach(b => b.onclick = () => { ex.confirm = null; explainView(); });
  main.querySelectorAll("[data-delyes]").forEach(b => b.onclick = async () => { try { await invoke("explain_delete", { id: +b.dataset.delyes }); notice("Séance supprimée."); } catch (er) { notice(errText(er), true); } ex.confirm = null; if (ex.id === +b.dataset.delyes) exReset(), ex.page = "history"; explainView(); });
}

// Proposition discrète en fin de session de travail (Pomodoro) : un bouton, rien ne s'ouvre tout seul.
function exBanner() {
  if ($("#exBanner")) return;
  const d = document.createElement("div"); d.id = "exBanner"; d.className = "upd-banner"; d.setAttribute("role", "status");
  d.innerHTML = `<span>Session terminée. Envie de vérifier ce que tu as retenu ?</span><button class="primary sm" id="exBannerGo">Explique-moi</button><button class="ghost sm" id="exBannerNo">Plus tard</button>`;
  bannerHost().appendChild(d);
  const close = () => d.remove();
  $("#exBannerGo").onclick = () => { close(); exOpen(); };
  $("#exBannerNo").onclick = close; setTimeout(close, 90000);
}

// Rechercher : mot libre + boutons par cours. Un cours choisi sans mot = tout son contenu.
const sv = { q: "", course: "" };
function searchView() {
  main.innerHTML = `<h1>Rechercher</h1><input id="q" type="search" placeholder="Qu'est-ce que tu cherches ?" value="${esc(sv.q)}" autofocus>
  <div class="row chips" role="group" aria-label="Filtrer par cours"><button class="chip ${sv.course ? "" : "on"}" data-c="" aria-pressed="${!sv.course}">Tout</button>
  ${cfg.courses.map(c => `<button class="chip ${sv.course === c ? "on" : ""}" data-c="${esc(c)}" aria-pressed="${sv.course === c}">${esc(c)}</button>`).join("")}</div><div id="out"></div>`;
  const run = async () => {
    const q = sv.q.trim(), o = $("#out");
    if (!q && !sv.course) { o.innerHTML = `<p class="msg">Tape un mot, ou choisis un cours pour voir tout ce qu'il contient.</p>`; return; }
    const r = await invoke("search", { q, course: sv.course || null });
    if (view !== "search") return;
    o.innerHTML = r.length ? `<p class="msg">${r.length} résultat${r.length > 1 ? "s" : ""}</p>` + r.map(i => itemRow(i)).join("")
      : `<p class="msg">Aucun résultat${q ? ` pour « ${esc(q)} »` : ""}${sv.course ? ` dans ${esc(sv.course)}` : ""}.</p>`;
    bindList();
  };
  let t; $("#q").oninput = () => { sv.q = $("#q").value; clearTimeout(t); t = setTimeout(run, 250); };
  main.querySelectorAll("[data-c]").forEach(b => b.onclick = () => {
    sv.course = b.dataset.c;
    main.querySelectorAll("[data-c]").forEach(x => { const on = x === b; x.classList.toggle("on", on); x.setAttribute("aria-pressed", on); });
    run();
  });
  run();
}
ttsInit(); bgInit(); applyCfg(); pomWidget(); lock(); if (!cfg.onboarded) welcome(); setTimeout(pollReminders, 1500); setTimeout(startupUpdateCheck, 4000);
nav("home");
// Si la police choisie n'est plus disponible, on le dit explicitement et on revient à la police par défaut.
fontsReady = loadAppFonts().then(() => checkAllFonts());
fontsReady.then(() => cfg.font === "body" ? true : checkFont(fontDef(cfg.font))).then(ok => {
  if (ok) return; // la police par défaut n'a pas de « police de secours » : inutile de prévenir
  notice(`La police « ${fontDef(cfg.font).label.split(" (")[0]} » est introuvable : retour à la police par défaut.`, true, 9000);
  cfg.font = "body"; applyCfg(); if (view === "settings") settings();
});
</script>
